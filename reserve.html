function render(){const rows=data.places.filter(p=>(!city.value||p.city===city.value)&&(!low.checked||p.lowRating)&&p.title.toLowerCase().includes(query.value.toLowerCase()));list.innerHTML=rows.map(p=>`<article class="reserve-row"><strong>${esc(p.title)}</strong><span>${p.rating.score==null?'Оценки нет':`${p.rating.score}${p.rating.scale===5?' / 5':''}`}</span><div class="reserve-meta">${esc(p.city)} · ${esc(p.status==='selected'?'В основном маршруте':p.status==='alternative'?'Альтернатива маршрута':p.status==='deferred'?'Отложено':'Не выбрано')} · карточек: ${p.catalogueCards}</div>${p.hook?`<div class="reserve-detail">${esc(p.hook)}</div>`:''}<div class="reserve-detail">${esc(p.reason)}</div>${p.limitations.map(x=>`<div class="reserve-detail">Учесть: ${esc(x)}</div>`).join('')}<details class="reserve-detail"><summary>Источники и подробности</summary><div>${p.rating.sources.filter(s=>s.url).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}${s.score==null?'':` ${s.score}${s.scale===5?'/5':''}`}${s.date?' · '+esc(s.date):''}</a>`).join(' · ')} ${p.googleUrls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Google Maps</a>`).join(' · ')}</div></details></article>`).join('')||'<p>Подходящих мест нет.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
for(const el of [city,query,low])el.addEventListener('input',render); render();</script></body></html>
